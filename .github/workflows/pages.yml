name: Deploy ACE CDL Explorer
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: runtime
      - name: Install wasm-pack
        run: cargo install wasm-pack --locked
      - name: Test Rust runtime
        run: cargo test --release --manifest-path runtime/Cargo.toml
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: verification/requirements.txt
      - name: Install OBC funnel comparator
        run: python -m pip install -r verification/requirements.txt
      - name: Verify Rust output against CDL reference trends
        run: python scripts/verify-obc.py
      - name: Save verification diagnostics
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: obc-verification
          path: verification/results
          if-no-files-found: ignore
      - name: Build WebAssembly
        run: sh scripts/build-wasm.sh
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Smoke test WebAssembly quick execution
        run: node scripts/smoke-wasm.mjs
      - name: Build Vue app
        working-directory: web
        run: npm ci && npm run test:cxf && npm run build
      - name: Add GTM to upstream Pages artifact
        env:
          GTM_CONTAINER_ID: ${{ secrets.GTM_CONTAINER_ID }}
        run: node scripts/inject-gtm.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          timeout: 1200000
