name: Deploy ACE CDL Explorer
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: runtime
      - name: Install wasm-pack
        run: cargo install wasm-pack --locked
      - name: Test Rust runtime
        run: cargo test --manifest-path runtime/Cargo.toml
      - name: Build WebAssembly
        run: sh scripts/build-wasm.sh
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build Vue app
        working-directory: web
        run: npm ci && npm run build
      - name: Add GTM to upstream Pages artifact
        env:
          GTM_CONTAINER_ID: ${{ secrets.GTM_CONTAINER_ID }}
        run: node scripts/inject-gtm.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          timeout: 1200000
