name: Browser compatibility checks
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      annual:
        description: Run the full-year G36 browser parity gate
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: cargo install wasm-pack --locked
      - run: sh scripts/build-wasm.sh
      - run: sh scripts/generate-web.sh --check
      - run: npm ci --prefix web
      - run: npm exec --prefix web -- playwright install --with-deps chromium
      - run: npm --prefix web run test:browser
        env:
          CDL_BROWSER_ANNUAL: ${{ inputs.annual && '1' || '0' }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failures
          path: web/test-results/
