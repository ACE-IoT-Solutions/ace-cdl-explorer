name: CDL and CXF checks
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: runtime
      - name: Runtime behavior and example graph checks
        run: cargo test --manifest-path runtime/Cargo.toml
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: verification/requirements.txt
      - name: Install OBC funnel comparator
        run: python -m pip install -r verification/requirements.txt
      - name: Verify Rust output against CDL reference trends
        run: python scripts/verify-obc.py
      - name: Save verification diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: obc-verification
          path: verification/results
          if-no-files-found: ignore
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: CXF reference, JSON-LD and CDL interface checks
        working-directory: web
        run: npm ci && npm run test:cxf && npm run typecheck
