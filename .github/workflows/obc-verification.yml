name: OBC time-series verification
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: runtime
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: verification/requirements.txt
      - run: python -m pip install -r verification/requirements.txt
      - run: python scripts/verify-obc.py
      - name: Save verification diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: obc-verification
          path: verification/results
          if-no-files-found: ignore
