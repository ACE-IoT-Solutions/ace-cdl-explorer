name: Rust runtime tests
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: runtime
      - run: python3 scripts/generate_examples.py && python3 scripts/generate_g36_sample.py && git diff --exit-code -- web/public/examples/four_pipe_building.json web/public/examples/four_pipe_g36.json web/public/examples/obc_zone_status.json web/public/examples/vav_composite_template.json web/public/examples/weather_2025.json
      - run: cargo test --manifest-path runtime/Cargo.toml
