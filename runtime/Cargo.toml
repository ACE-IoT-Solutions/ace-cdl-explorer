[package]
name = "ace-cdl-runtime"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "0.2"
meval = "0.2"
arrow-array = "60.1.0"
arrow-schema = "60.1.0"
arrow-ipc = "60.1.0"

[dev-dependencies]
approx = "0.5"
