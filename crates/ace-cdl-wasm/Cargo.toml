[package]
name = "ace-cdl-wasm"
version = "0.1.0"
edition.workspace = true
repository.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
ace-building-sim = { path = "../ace-building-sim" }
cdl-model = { path = "../cdl-model" }
cdl-compat = { path = "../cdl-compat" }
cdl-exec = { path = "../cdl-exec", features = ["equations"] }
cdl-blocks = { path = "../cdl-blocks" }
cxf = { package = "cdl-cxf", path = "../cxf" }
serde_json.workspace = true
wasm-bindgen.workspace = true
arrow-array.workspace = true
arrow-schema.workspace = true
arrow-ipc.workspace = true
