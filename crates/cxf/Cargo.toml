[package]
name = "cdl-cxf"
version = "0.1.2"
edition.workspace = true
repository.workspace = true
license-file = "LICENSE"
readme = "README.md"
keywords = ["cdl", "hvac", "controls", "modelica"]
categories = ["science", "simulation"]
rust-version = "1.85"
description = "Compacted CXF JSON-LD import and export for canonical CDL models"

[features]
default = ["bundled-core"]
bundled-core = []

[dependencies]
cdl-model = { path = "../cdl-model", version = "0.1.2" }
serde.workspace = true
serde_json.workspace = true


[lib]
name = "cxf"
