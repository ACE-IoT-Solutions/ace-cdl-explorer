[package]
name = "cdl-verify"
version = "0.1.2"
edition.workspace = true
repository.workspace = true
license-file = "LICENSE"
readme = "README.md"
keywords = ["cdl", "hvac", "controls", "modelica"]
categories = ["science", "simulation"]
rust-version = "1.85"
description = "Native CDL trend replay and absolute time/value funnel verification"

[dependencies]
cdl-model = { path = "../cdl-model", version = "0.1.2" }
cdl-blocks = { path = "../cdl-blocks", version = "0.1.2" }
cdl-exec = { path = "../cdl-exec", version = "0.1.2", features = ["equations"] }
cdl-compat = { path = "../cdl-compat", version = "0.1.2" }
cxf = { package = "cdl-cxf", path = "../cxf", version = "0.1.2" }
serde.workspace = true
serde_json.workspace = true
csv = "1.3"
sha2 = "0.10"
