[package]
name = "cdl-cli"
version = "0.1.1"
edition.workspace = true
repository.workspace = true
license-file = "LICENSE"
readme = "README.md"
keywords = ["cdl", "hvac", "controls", "modelica"]
categories = ["science", "simulation"]
rust-version = "1.85"
description = "Validate, convert, run and verify CDL controllers"

[[bin]]
name = "cdl"
path = "src/main.rs"

[dependencies]
cdl-model = { path = "../cdl-model", version = "0.1.1" }
cdl-blocks = { path = "../cdl-blocks", version = "0.1.1" }
cdl-exec = { path = "../cdl-exec", version = "0.1.1", features = ["equations"] }
cdl-compat = { path = "../cdl-compat", version = "0.1.1" }
cxf = { package = "cdl-cxf", path = "../cxf", version = "0.1.1" }
cdl-verify = { path = "../cdl-verify", version = "0.1.1" }
serde_json.workspace = true
csv = "1.3"
clap = { version = "4.5", features = ["derive"] }
