[package]
name = "cdl-exec"
version = "0.1.1"
edition.workspace = true
repository.workspace = true
license-file = "LICENSE"
readme = "README.md"
keywords = ["cdl", "hvac", "controls", "modelica"]
categories = ["science", "simulation"]
rust-version = "1.85"
description = "Compile and execute canonical CDL documents"

[features]
default = []
equations = ["dep:meval"]
serde = ["dep:serde", "dep:serde_json", "dep:sha2", "cdl-blocks/serde"]

[dependencies]
serde = {workspace=true, optional=true}
serde_json = {workspace=true, optional=true}
sha2 = {version="0.10",optional=true}
cdl-model = { path = "../cdl-model", version = "0.1.1" }
cdl-blocks = { path = "../cdl-blocks", version = "0.1.1" }
meval = { workspace = true, optional = true }

[dev-dependencies]
cxf = { package = "cdl-cxf", path = "../cxf", version = "0.1.1" }
cdl-compat = { path = "../cdl-compat", version = "0.1.1" }
serde_json.workspace = true
