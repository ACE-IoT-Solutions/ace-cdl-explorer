[package]
name = "cdl-compat"
version = "0.1.1"
edition.workspace = true
repository.workspace = true
license-file = "LICENSE"
readme = "README.md"
keywords = ["cdl", "hvac", "controls", "modelica"]
categories = ["science", "simulation"]
rust-version = "1.85"
description = "Lossless simplified CDL JSON adapter for the canonical model"

[dependencies]
cxf = { package = "cdl-cxf", path = "../cxf", version = "0.1.1" }
cdl-blocks = { path = "../cdl-blocks", version = "0.1.1" }
cdl-model = { path = "../cdl-model", version = "0.1.1" }
serde.workspace = true
serde_json.workspace = true
